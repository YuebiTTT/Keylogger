name: MSBuild

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  SOLUTION_FILE_PATH: Keylogger.sln
  BUILD_CONFIGURATION: Release
  # 根据项目实际平台设置：x86-windows 或 x64-windows
  VCPKG_DEFAULT_TRIPLET: x64-windows-static
  VCPKG_ROOT: ${{ github.workspace }}\vcpkg

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup vcpkg
      run: |
        git clone https://github.com/Microsoft/vcpkg.git
        .\vcpkg\bootstrap-vcpkg.bat
        .\vcpkg\vcpkg integrate install

    - name: Install dependencies
      run: |
        .\vcpkg\vcpkg install curl nlohmann-json --triplet ${{ env.VCPKG_DEFAULT_TRIPLET }}

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v1.0.2

    - name: Restore NuGet packages
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: nuget restore ${{env.SOLUTION_FILE_PATH}}

    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: |
        msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} /p:Platform=x64 /p:Version=${{ steps.set_version.outputs.version }} ${{env.SOLUTION_FILE_PATH}}

    - name: Find build artifacts
      run: |
        Write-Host "Searching for Keylogger.exe in the repository..."
        $exePath = Get-ChildItem -Path "${{ github.workspace }}" -Name "Keylogger.exe" -Recurse
        if ($exePath) {
          Write-Host "Found Keylogger.exe at: $exePath"
          New-Item -ItemType Directory -Path "${{ github.workspace }}\artifacts" -Force
          Copy-Item -Path "${{ github.workspace }}\$exePath" -Destination "${{ github.workspace }}\artifacts\" -Force
          Get-ChildItem -Path "${{ github.workspace }}\artifacts"
        } else {
          Write-Host "Keylogger.exe not found, listing all files in repository..."
          Get-ChildItem -Path "${{ github.workspace }}" -Recurse | Select-Object FullName | Where-Object { $_.FullName -like "*.exe" }
          throw "Keylogger.exe not found in build output"
        }

    - name: Set version number
      id: set_version
      run: |
        # 设置版本号
        $major = 4
        $minor = 1
        $patch = $env:GITHUB_RUN_NUMBER
        $version = "$major.$minor.$patch"
        Write-Host "Version: $version"
        echo "version=$version" >> $env:GITHUB_OUTPUT

    - name: Create GitHub Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ steps.set_version.outputs.version }}
        release_name: Release v${{ steps.set_version.outputs.version }}
        draft: false
        prerelease: false

    - name: Rename artifact with version
      run: |
        $version = "${{ steps.set_version.outputs.version }}"
        Rename-Item -Path "${{ github.workspace }}\artifacts\Keylogger.exe" -NewName "Keylogger_v$version.exe"

    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ github.workspace }}\artifacts\Keylogger_v${{ steps.set_version.outputs.version }}.exe
        asset_name: Keylogger_v${{ steps.set_version.outputs.version }}.exe
        asset_content_type: application/octet-stream
