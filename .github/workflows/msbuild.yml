name: MSBuild

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  SOLUTION_FILE_PATH: Keylogger.sln
  BUILD_CONFIGURATION: Release
  # 根据项目实际平台设置：x86-windows 或 x64-windows
  VCPKG_DEFAULT_TRIPLET: x64-windows
  VCPKG_ROOT: ${{ github.workspace }}\vcpkg

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup vcpkg
      run: |
        git clone https://github.com/Microsoft/vcpkg.git
        .\vcpkg\bootstrap-vcpkg.bat
        .\vcpkg\vcpkg integrate install

    - name: Install dependencies
      run: |
        .\vcpkg\vcpkg install curl nlohmann-json --triplet ${{ env.VCPKG_DEFAULT_TRIPLET }}

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v1.0.2

    - name: Restore NuGet packages
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: nuget restore ${{env.SOLUTION_FILE_PATH}}

    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: |
        msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} /p:Platform=x64 ${{env.SOLUTION_FILE_PATH}}

    - name: Prepare release artifacts
      run: |
        New-Item -ItemType Directory -Path "${{ github.workspace }}\artifacts" -Force
        Copy-Item -Path "${{ github.workspace }}\Keylogger\x64\Release\Keylogger.exe" -Destination "${{ github.workspace }}\artifacts\" -Force
        Get-ChildItem -Path "${{ github.workspace }}\artifacts"

    - name: Create GitHub Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ github.run_number }}
        release_name: Release v${{ github.run_number }}
        draft: false
        prerelease: false

    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ github.workspace }}\artifacts\Keylogger.exe
        asset_name: Keylogger.exe
        asset_content_type: application/octet-stream
